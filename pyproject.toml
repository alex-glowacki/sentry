[build-system]
requires = [ "hatchling" ]
build-backend = "hatchling.build"

[project]
name = "sentry"
version = "0.1.0"
description = "AI-powered airsoft turret - Hailo inference on Raspberry Pi 5 -> Arduino relay control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [ "pyserial>=3.5", "numpy>=1.26" ]

[project.scripts]
sentry = "sentry.main:main"

[project.optional-dependencies]
dev = [ "pytest>=8.0", "pytest-cov", "ruff", "mypy", "types-pyserial" ]

[tool.hatch.build.targets.wheel]
packages = [ "src/sentry" ]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [ "E", "F", "I", "UP" ]

[tool.mypy]
python_version = "3.11"
strict = true
files = [ "src" ]

[[tool.mypy.overrides]]
module = [ "hailo_platform.*", "picamera2.*" ]
ignore_missing_imports = true

[tool.pytest.ini_option]
testpaths = [ "tests" ]
