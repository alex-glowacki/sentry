# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python — lint, type-check, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src/

      - name: Mypy
        run: mypy src/

      - name: Pytest
        run: pytest

  firmware:
    name: Firmware — PlatformIO build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Install PlatformIO dependencies
        run: cd firmware && pio run --target depends || true

      - name: Patch dcd_rusb2.c for GCC 14
        run: |
          FILE=~/.platformio/packages/framework-arduinorenesas-uno/cores/arduino/tinyusb/rusb2/dcd_rusb2.c
          sed -i 's/TU_ASSERT(num);/if (!num) return;/' $FILE
          sed -i '512s/if (!num) return;/if (!num) return false;/' $FILE
          sed -i '834s/if (!num) return;/if (!num) return false;/' $FILE

      - name: Build firmware
        run: cd firmware && pio run
